<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedidos de Compra</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../backend/script.js" defer></script>
</head>
<body>
  <h2>Novo Pedido de Compra</h2>
  <form id="formPedido">
    <label>Fornecedor:</label>
    <input type="text" id="fornecedorPedido" required>
    
    <label>Item/Produto:</label>
    <input type="text" id="itemPedido" required>
    
    <label>Quantidade:</label>
    <input type="number" id="quantidadePedido" required min="1">
    
    <label>Preço de Custo (Unitário):</label>
    <input type="number" id="precoCusto" required step="0.01">
    
    <label>Data Prevista:</label>
    <input type="date" id="dataPedido" required>
    
    <button type="submit">Registrar Pedido</button>
  </form>
  <a href="index.html">Voltar à página inicial</a>
</body>
</html>
